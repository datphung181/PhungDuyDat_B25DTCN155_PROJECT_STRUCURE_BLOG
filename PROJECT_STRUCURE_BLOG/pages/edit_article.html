<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Article</title>
  <link rel="stylesheet" href="../style_css/add_new_article.css">
</head>
<body>

<div class="page">

  <!-- Close -->
  <button class="btn-close" onclick="window.history.back()">&#x2715;</button>

  <!-- Title -->
  <h1 class="page-title">📝 Edit Article</h1>

  <!-- Title field -->
  <div class="form-group">
    <label for="title">Title:</label>
    <input type="text" id="title" placeholder="">
    <span class="error-msg" id="titleError"></span>
  </div>

  <!-- Category -->
  <div class="form-group">
    <label for="category">Article Categories:</label>
    <select id="category">
        <option value="select a category"> Select a category </option>
    </select>
    <span class="error-msg" id="categoryError"></span>
  </div>

  <!-- Mood -->
  <div class="form-group">
    <label for="mood">Mood:</label>
    <input type="text" id="mood" list="mood-options" placeholder="😊 Happy">
    <datalist id="mood-options">
      <option value="😊 Happy">
      <option value="😢 Sad">
      <option value="🤩 Excited">
      <option value="😰 Anxious">
      <option value="😌 Calm">
      <option value="😠 Angry">
      <option value="😲 Surprised">
      <option value="😑 Bored">
      <option value="😴 Tired">
      <option value="🥹 Grateful">
      <option value="🌟 Hopeful">
      <option value="😕 Confused">
      <option value="🥺 Lonely">
      <option value="😤 Proud">
      <option value="🥰 In Love">
    </datalist>
    <span class="error-msg" id="moodError"></span>
  </div>

  <!-- Content -->
  <div class="form-group">
    <label for="content">Content:</label>
    <textarea id="content"></textarea>
    <span class="error-msg" id="contentError"></span>
  </div>

  <!-- Status -->
  <div class="status-row">
    <span class="status-label">Status</span>
    <div class="radio-group">
      <label>
        <input type="radio" name="status" value="public" checked> public
      </label>
      <label>
        <input type="radio" name="status" value="private"> private
      </label>
    </div>
  </div>

  <!-- Upload -->
  <div class="upload-box">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
         stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 16v-8m0 0l-3 3m3-3l3 3M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1" />
    </svg>
    <p>Browse and choose the files you want to upload from your computer</p>
    <input type="file" id="imageInput" accept="image/*" style="margin-top:10px">
  </div>

  <!-- Submit -->
  <button class="btn-add" id="addBtn">Save Changes</button>

</div>

<script type="module" src="../javascript/edit_article.js"></script>
</body>
</html>
